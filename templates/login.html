{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Billofy Admin</title>
    <script src="{% static 'js/tailwindcss.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/all.min.css' %}">
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-200 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-red-600"></div>

        <div class="text-center mb-8">
            <img src="{% static 'images/billofy_key.png' %}" alt="Logo" class="w-16 h-16 mx-auto mb-3 object-contain">
            <h1 class="text-2xl font-bold text-slate-800">Admin Login</h1>
            <p class="text-slate-500 text-sm">Sign in to manage licenses</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="bg-red-100 border border-red-200 text-red-700 px-4 py-3 rounded relative mb-4 text-sm" role="alert">
                    <span class="block sm:inline"><i class="fa-solid fa-circle-exclamation mr-2"></i> {{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="block text-slate-700 text-sm font-bold mb-2">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="username" required 
                        class="w-full pl-10 pr-3 py-3 rounded-lg border border-slate-300 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition">
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-slate-700 text-sm font-bold mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required 
                        class="w-full pl-10 pr-3 py-3 rounded-lg border border-slate-300 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition">
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-slate-900 text-white font-bold py-3 px-4 rounded-lg hover:bg-red-600 transition duration-300 shadow-md flex justify-center items-center gap-2">
                Login <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

</body>
</html>
